name: macOS island screenshots
on:
  pull_request:
    paths:
      - 'electron/island*'
      - 'src/island/**'
      - 'island.html'
      - 'shared/island.ts'
      - 'src/components/IslandSettings.tsx'
      - 'scripts/testing/island-screenshots*.mjs'
      - '.github/workflows/island-screenshots.yml'
  push:
    branches: [main, T-1231-mac-island]
    paths:
      - 'electron/island*'
      - 'src/island/**'
      - 'island.html'
      - 'shared/island.ts'
      - 'src/components/IslandSettings.tsx'
      - 'scripts/testing/island-screenshots*.mjs'
      - '.github/workflows/island-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  island-screenshots:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron --version
      - run: pnpm exec vite build
      - run: node --test --test-concurrency=1 electron/island*.node-test.mjs
      - run: pnpm exec vitest run src/island/Island.test.ts
      - run: node --experimental-vm-modules --test scripts/testing/island-screenshots.node-test.mjs
      - run: pnpm exec electron scripts/testing/island-screenshots.mjs
        timeout-minutes: 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: island-screenshots
          path: artifacts/island-screenshots/*.png
          if-no-files-found: error

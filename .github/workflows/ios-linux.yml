name: iOS Linux

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "mobile/ios/**"
      - "shared/**"
      - "src/locales/**"
      - ".github/workflows/ios-linux.yml"
  workflow_dispatch:

concurrency:
  group: ios-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Node test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Swift version
        run: swift --version
      - name: CryKit Linux tests
        run: mobile/ios/scripts/linux-test.sh
      - name: Swift and strings checks
        if: ${{ !cancelled() }}
        run: mobile/ios/scripts/linux-check.sh
      - name: Node script tests
        if: ${{ !cancelled() }}
        run: node --test mobile/ios/scripts/*.test.mjs

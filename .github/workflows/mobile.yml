name: Mobile builds

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "mobile/ios/**"
      - "mobile/android/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/ios/**"
      - "mobile/android/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crybot-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode 26
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' ! -iname '*beta*' | sort -V | tail -1)
          if [[ -z "$xcode" ]]; then
            echo 'Xcode 26 is not installed'
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            mobile/ios/SourcePackages
          key: ${{ runner.os }}-xcode26-spm-${{ hashFiles('mobile/ios/Package.resolved') }}
          restore-keys: ${{ runner.os }}-xcode26-spm-
      - name: Test CryKit
        working-directory: .
        run: swift test --package-path mobile/ios/Packages/CryKit
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and restore package lock
        run: |
          xcodegen generate
          if [[ -f Package.resolved ]]; then
            mkdir -p CryBot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
            cp Package.resolved CryBot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            echo 'CRYBOT_PACKAGE_RESOLUTION=-disableAutomaticPackageResolution' >> "$GITHUB_ENV"
          fi
      - name: Select iPhone 16 simulator
        run: |
          xcrun simctl list --json > "$RUNNER_TEMP/crybot-simulators.json"
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path

          inventory = json.loads((Path(os.environ["RUNNER_TEMP"]) / "crybot-simulators.json").read_text())
          runtimes = [runtime for runtime in inventory["runtimes"]
                      if runtime.get("isAvailable") and ".iOS-" in runtime["identifier"]]
          if not runtimes:
              raise SystemExit("No available iOS runtime")
          runtime = max(runtimes, key=lambda item: tuple(int(part) for part in item["version"].split(".")))
          available = [device for device in inventory["devices"].get(runtime["identifier"], [])
                       if device.get("isAvailable")]
          selected = next((device for device in available
                           if device.get("deviceTypeIdentifier", "").endswith(".iPhone-16")
                           or device["name"] == "iPhone 16"), None)
          action = "Selected existing iPhone 16"
          if selected is None:
              types = json.loads(subprocess.check_output(
                  ["xcrun", "simctl", "list", "devicetypes", "--json"], text=True))["devicetypes"]
              device_type = next((item for item in types if item["name"] == "iPhone 16"), None)
              if device_type is not None:
                  udid = subprocess.check_output(
                      ["xcrun", "simctl", "create", "iPhone 16", device_type["identifier"], runtime["identifier"]],
                      text=True).strip()
                  if not udid:
                      raise SystemExit("simctl create returned an empty simulator ID")
                  selected = {"name": "iPhone 16", "udid": udid}
                  action = "Created iPhone 16 (" + device_type["identifier"] + ")"
              else:
                  selected = next((device for device in available
                                   if ".iPhone-" in device.get("deviceTypeIdentifier", "")
                                   or device["name"].startswith("iPhone")), None)
                  if selected is None:
                      raise SystemExit("No iPhone 16 device type or available iPhone in " + runtime["identifier"])
                  action = "Fallback to available iPhone (iPhone 16 device type missing)"
          print(action + ":", selected["name"], selected["udid"], "runtime:", runtime["identifier"])
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("CRYBOT_TEST_SIMULATOR=" + selected["udid"] + "\n")
          PYCODE
      - name: Select iOS test scope
        id: test-scope
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > "$RUNNER_TEMP/crybot-changed-files.txt"
            scripts/ui-test-selection.sh < "$RUNNER_TEMP/crybot-changed-files.txt" > "$RUNNER_TEMP/crybot-test-scope.txt"
            { IFS= read -r 'scope[0]'; IFS= read -r 'scope[1]'; } < "$RUNNER_TEMP/crybot-test-scope.txt"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            scope=(none "")
          else
            scope=(all "")
          fi
          echo "CRYBOT_SNAPSHOT_FEATURES=${scope[0]}" >> "$GITHUB_ENV"
          echo "CRYBOT_UI_ONLY_TESTING=${scope[1]}" >> "$GITHUB_ENV"
          echo "snapshot features: ${scope[0]}"
          echo "XCUITest arguments: ${scope[1]}"

      - name: Build app and all test bundles once
        run: |
          env TEST_RUNNER_CRY_SNAPSHOT_FEATURES="${CRYBOT_SNAPSHOT_FEATURES:-}" xcodebuild -project CryBot.xcodeproj -scheme CryBot -configuration Debug \
            -destination "platform=iOS Simulator,id=$CRYBOT_TEST_SIMULATOR" \
            -derivedDataPath DerivedData/Tests -clonedSourcePackagesDirPath SourcePackages \
            ${CRYBOT_PACKAGE_RESOLUTION:-} build-for-testing CODE_SIGNING_ALLOWED=NO
      - name: Verify embedded watch app
        run: test -d 'DerivedData/Tests/Build/Products/Debug-iphonesimulator/Cry Bot.app/Watch/CryBotWatch.app'
      - name: Run hosted app and watch unit tests without rebuilding
        run: |
          env TEST_RUNNER_CRY_SNAPSHOT_FEATURES="${CRYBOT_SNAPSHOT_FEATURES:-}" xcodebuild -project CryBot.xcodeproj -scheme CryBot -configuration Debug \
            -destination "platform=iOS Simulator,id=$CRYBOT_TEST_SIMULATOR" \
            -derivedDataPath DerivedData/Tests -clonedSourcePackagesDirPath SourcePackages \
            ${CRYBOT_PACKAGE_RESOLUTION:-} -resultBundlePath "DerivedData/CryBotTests.xcresult" \
            -parallel-testing-enabled NO -only-testing:CryBotTests \
            test-without-building CODE_SIGNING_ALLOWED=NO
          scripts/assert-tests-ran.sh DerivedData/CryBotTests.xcresult --required
          for target in CryBotWatchTests; do
            xcodebuild -project CryBot.xcodeproj -scheme CryBot -configuration Debug \
              -destination "platform=iOS Simulator,id=$CRYBOT_TEST_SIMULATOR" \
              -derivedDataPath DerivedData/Tests -clonedSourcePackagesDirPath SourcePackages \
              ${CRYBOT_PACKAGE_RESOLUTION:-} -resultBundlePath "DerivedData/$target.xcresult" \
              -parallel-testing-enabled NO -only-testing:"$target" \
              test-without-building CODE_SIGNING_ALLOWED=NO
            scripts/assert-tests-ran.sh "DerivedData/$target.xcresult" --required
          done

      - name: Run selected XCUITest flows
        if: success()
        run: |
          if [[ "${CRYBOT_SNAPSHOT_FEATURES}" == "all" ]]; then
            flow_args=(-only-testing:CryBotUITests)
          elif [[ -n "${CRYBOT_UI_ONLY_TESTING:-}" ]]; then
            read -r -a flow_args <<< "$CRYBOT_UI_ONLY_TESTING"
          elif [[ -z "${CRYBOT_SNAPSHOT_FEATURES}" || "${CRYBOT_SNAPSHOT_FEATURES}" == "none" ]]; then
            echo 'No snapshot features selected'
            exit 0
          else
            echo 'Selected features have no FlowTests directories; running harness flow'
            flow_args=(-only-testing:CryBotUITests/HarnessFlowTests)
          fi
          xcodebuild -project CryBot.xcodeproj -scheme CryBot -configuration Debug \
            -destination "platform=iOS Simulator,id=$CRYBOT_TEST_SIMULATOR" \
            -derivedDataPath DerivedData/Tests -clonedSourcePackagesDirPath SourcePackages \
            ${CRYBOT_PACKAGE_RESOLUTION:-} -resultBundlePath DerivedData/CryBotUITests.xcresult \
            -parallel-testing-enabled NO "${flow_args[@]}" \
            test-without-building CODE_SIGNING_ALLOWED=NO
          scripts/assert-tests-ran.sh DerivedData/CryBotUITests.xcresult --required

      - name: Export and validate screenshots
        if: always()
        run: scripts/export-screenshots.sh DerivedData/screenshots "${CRYBOT_SNAPSHOT_FEATURES:-none}" DerivedData/*.xcresult

      - name: Upload first package resolution
        if: always() && hashFiles('mobile/ios/Package.resolved') == ''
        uses: actions/upload-artifact@v4
        with:
          name: package-resolved
          path: mobile/ios/CryBot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: warn
      - name: Upload screenshots
        if: always() && env.CRYBOT_SNAPSHOT_FEATURES != '' && env.CRYBOT_SNAPSHOT_FEATURES != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: mobile/ios/DerivedData/screenshots
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crybot-mobile-tests
          path: mobile/ios/DerivedData/*.xcresult
          if-no-files-found: ignore

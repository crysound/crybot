name: Mobile builds

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "mobile/ios/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/ios/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crybot-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' ! -iname '*beta*' | sort -V | tail -1)
          if [[ -z "$xcode" ]]; then
            echo 'Xcode 26 is not installed'
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            mobile/ios/SourcePackages
          key: ${{ runner.os }}-xcode26-spm-${{ hashFiles('mobile/ios/Package.resolved') }}
          restore-keys: ${{ runner.os }}-xcode26-spm-
      - name: Test CryKit
        working-directory: .
        run: swift test --package-path mobile/ios/Packages/CryKit
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and restore package lock
        run: |
          xcodegen generate
          if [[ -f Package.resolved ]]; then
            mkdir -p CryBot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
            cp Package.resolved CryBot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            echo 'CRYBOT_PACKAGE_RESOLUTION=-disableAutomaticPackageResolution' >> "$GITHUB_ENV"
          fi
      - name: Select iPhone 16 simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/crybot-simulators.json"
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "crybot-simulators.json").read_text())["devices"]
          runtimes = sorted((runtime for runtime in devices if ".iOS-" in runtime),
                            key=lambda runtime: tuple(int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-")),
                            reverse=True)
          candidates = [device for runtime in runtimes for device in devices[runtime]
                        if device.get("isAvailable") and device["name"] == "iPhone 16"]
          if not candidates:
              raise SystemExit("No available iPhone 16 simulator")
          selected = candidates[0]
          print("Selected simulator:", selected["name"], selected["udid"])
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("CRYBOT_TEST_SIMULATOR=" + selected["udid"] + "\n")
          PYCODE
      - name: Build app and all test bundles once
        run: |
          xcodebuild -project CryBot.xcodeproj -scheme CryBot -configuration Debug \
            -destination "platform=iOS Simulator,id=$CRYBOT_TEST_SIMULATOR" \
            -derivedDataPath DerivedData/Tests -clonedSourcePackagesDirPath SourcePackages \
            ${CRYBOT_PACKAGE_RESOLUTION:-} build-for-testing CODE_SIGNING_ALLOWED=NO
      - name: Verify embedded watch app
        run: test -d 'DerivedData/Tests/Build/Products/Debug-iphonesimulator/Cry Bot.app/Watch/CryBotWatch.app'
      - name: Run hosted app and watch unit tests without rebuilding
        run: |
          for target in CryBotTests CryBotWatchTests; do
            xcodebuild -project CryBot.xcodeproj -scheme CryBot -configuration Debug \
              -destination "platform=iOS Simulator,id=$CRYBOT_TEST_SIMULATOR" \
              -derivedDataPath DerivedData/Tests -clonedSourcePackagesDirPath SourcePackages \
              ${CRYBOT_PACKAGE_RESOLUTION:-} -resultBundlePath "DerivedData/$target.xcresult" \
              -parallel-testing-enabled NO -only-testing:"$target" \
              test-without-building CODE_SIGNING_ALLOWED=NO
            xcrun xcresulttool get test-results summary --path "DerivedData/$target.xcresult" > "$RUNNER_TEMP/$target-summary.json"
            python3 - "$RUNNER_TEMP/$target-summary.json" "$target" <<'PYCODE'
          import json
          import sys

          summary = json.load(open(sys.argv[1]))
          count = summary["totalTestCount"]
          print(f"{sys.argv[2]}: {count} selected tests executed")
          if count <= 0:
              raise SystemExit("No selected tests executed")
          PYCODE
          done
      - name: Upload first package resolution
        if: always() && hashFiles('mobile/ios/Package.resolved') == ''
        uses: actions/upload-artifact@v4
        with:
          name: package-resolved
          path: mobile/ios/CryBot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: warn
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crybot-mobile-tests
          path: mobile/ios/DerivedData/*.xcresult
          if-no-files-found: ignore

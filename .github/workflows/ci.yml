name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm exec tsc -p tsconfig.server.json
      - run: pnpm lint
      - run: pnpm i18n:check
      - run: pnpm vitest run --maxWorkers=2
      - run: pnpm check:brand

name: Public scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  public-scan:
    name: Public scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Test public scan
        run: node --test scripts/public-scan/scan.node-test.mjs
      - name: Scan pull request additions
        env:
          PUBLIC_SCAN_DENYLIST_KEY: ${{ secrets.PUBLIC_SCAN_DENYLIST_KEY }}
        run: node scripts/public-scan/scan.mjs --base "${{ github.event.pull_request.base.sha }}"

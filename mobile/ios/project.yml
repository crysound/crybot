name: CryBot
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CRYBOT_SERVER_URL: ""
    CRYBOT_LOGIN_HOSTS: ""
    CRYBOT_APP_LINK_HOST: ""
    CRYBOT_IOS_ENTITLEMENTS: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CryBot:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CryBot
      - path: Shared
    dependencies:
      - target: CryBotWatch
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot
        PROVISIONING_PROFILE_SPECIFIER: $(CRYBOT_IOS_PROFILE_SPECIFIER)
        CODE_SIGN_ENTITLEMENTS: $(CRYBOT_IOS_ENTITLEMENTS)
        PRODUCT_NAME: Cry Bot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: CryBot/Info.plist
      properties:
        CFBundleDisplayName: Cry Bot
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - crybot
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Cry Bot needs microphone access for voice features.
        NSCameraUsageDescription: Cry Bot needs camera access for video features.
        NSPhotoLibraryUsageDescription: Cry Bot needs photo library access to choose files.
        CRYBOT_SERVER_URL: $(CRYBOT_SERVER_URL)
        CRYBOT_LOGIN_HOSTS: $(CRYBOT_LOGIN_HOSTS)
        CRYBOT_APP_LINK_HOST: $(CRYBOT_APP_LINK_HOST)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  CryBotWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CryBotWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot.watchkitapp
        PROVISIONING_PROFILE_SPECIFIER: $(CRYBOT_WATCH_PROFILE_SPECIFIER)
        PRODUCT_NAME: CryBotWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: CryBotWatch/Info.plist
      properties:
        CFBundleDisplayName: Cry Bot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.crysound.crybot
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
        CRYBOT_SERVER_URL: $(CRYBOT_SERVER_URL)
  CryBotWatchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CryBotWatchTests
      - path: Shared
      - path: CryBotWatch/APIClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot.watchtests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CryBot:
    shared: true
    build:
      targets:
        CryBot: all
  CryBotWatch:
    shared: true
    build:
      targets:
        CryBotWatch: all
  CryBotWatchTests:
    shared: true
    build:
      targets:
        CryBotWatchTests: [test]
    test:
      targets:
        - CryBotWatchTests

name: CryBot
options:
  developmentLanguage: en
  knownRegions: [en, de, es, fr, hi, it, ja, ko, pl, pt-BR, ru, tr, uk, vi, zh-Hans, zh-Hant]
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CRYBOT_SERVER_URL: ""
    CRYBOT_LOGIN_HOSTS: ""
    CRYBOT_API_URL: ""
    CRYBOT_APP_LINK_HOST: ""
    CRYBOT_IOS_ENTITLEMENTS: CryBot/CryBot.entitlements
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CryKit:
    path: Packages/CryKit
  SwiftMarkdown:
    url: https://github.com/apple/swift-markdown.git
    exactVersion: 0.9.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift.git
    exactVersion: 1.1.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.19.0
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    exactVersion: 150.7871.04
targets:
  CryBot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CryBot
      - path: Shared
    dependencies:
      - package: CryKit
        product: CryCore
      - package: CryKit
        product: CryNetLogic
      - package: CryKit
        product: CryNet
      - package: CryKit
        product: CryRFB
      - package: SwiftMarkdown
        product: Markdown
      - package: SwiftMath
        product: SwiftMath
      - package: HighlightSwift
        product: HighlightSwift
      - package: LiveKit
        product: LiveKit
      - package: LiveKitWebRTC
        product: LiveKitWebRTC
      - target: CryBotWatch
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot
        CODE_SIGN_ENTITLEMENTS: $(CRYBOT_IOS_ENTITLEMENTS)
        PROVISIONING_PROFILE_SPECIFIER: $(CRYBOT_IOS_PROFILE_SPECIFIER)
        PRODUCT_NAME: Cry Bot
        PRODUCT_MODULE_NAME: CryBot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: CryBot/Info.plist
      properties:
        CFBundleDisplayName: Cry Bot
        CFBundleLocalizations: [en, de, es, fr, hi, it, ja, ko, pl, pt-BR, ru, tr, uk, vi, zh-Hans, zh-Hant]
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - crybot
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Cry Bot needs microphone access for voice features.
        NSCameraUsageDescription: Cry Bot needs camera access for video features.
        NSPhotoLibraryUsageDescription: Cry Bot needs photo library access to choose files.
        NSPhotoLibraryAddUsageDescription: Cry Bot needs permission to save images to your photo library.
        UIBackgroundModes: [audio]
        CRYBOT_API_URL: $(CRYBOT_API_URL)
        CRYBOT_APP_LINK_HOST: $(CRYBOT_APP_LINK_HOST)
        CRYBOT_SERVER_URL: $(CRYBOT_SERVER_URL)
        CRYBOT_LOGIN_HOSTS: $(CRYBOT_LOGIN_HOSTS)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  CryBotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CryBotTests
    dependencies:
      - target: CryBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cry Bot.app/Cry Bot
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  CryBotUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CryBotUITests
    dependencies:
      - target: CryBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CryBot
  CryBotWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CryBotWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot.watchkitapp
        PROVISIONING_PROFILE_SPECIFIER: $(CRYBOT_WATCH_PROFILE_SPECIFIER)
        PRODUCT_NAME: CryBotWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: CryBotWatch/Info.plist
      properties:
        CFBundleDisplayName: Cry Bot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.crysound.crybot
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
        CRYBOT_SERVER_URL: $(CRYBOT_SERVER_URL)
  CryBotWatchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CryBotWatchTests
      - path: Shared
      - path: CryBotWatch/APIClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot.watchtests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CryBot:
    shared: true
    build:
      targets:
        CryBot: all
        CryBotTests: [test]
        CryBotWatchTests: [test]
        CryBotUITests: [test]
    test:
      targets:
        - CryBotTests
        - CryBotWatchTests
        - CryBotUITests
  CryBotWatch:
    shared: true
    build:
      targets:
        CryBotWatch: all
  CryBotWatchTests:
    shared: true
    build:
      targets:
        CryBotWatchTests: [test]
    test:
      targets:
        - CryBotWatchTests

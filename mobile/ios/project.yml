name: CryBot
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CRYBOT_SERVER_URL: ""
    CRYBOT_LOGIN_HOSTS: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CryBot:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CryBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crysound.crybot
        PRODUCT_NAME: Cry Bot
        INFOPLIST_FILE: CryBot/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      properties:
        CFBundleDisplayName: Cry Bot
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Cry Bot needs microphone access for voice features.
        NSCameraUsageDescription: Cry Bot needs camera access for video features.
        NSPhotoLibraryUsageDescription: Cry Bot needs photo library access to choose files.
        CRYBOT_SERVER_URL: $(CRYBOT_SERVER_URL)
        CRYBOT_LOGIN_HOSTS: $(CRYBOT_LOGIN_HOSTS)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  CryBot:
    shared: true
    build:
      targets:
        CryBot: all
